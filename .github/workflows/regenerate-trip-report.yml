name: Regenerate VanLife trip report

# Prevent two copies of this workflow from trying to modify main at the same time.
concurrency:
  group: regenerate-vanlife-trip-report
  cancel-in-progress: false

on:
  schedule:
    # Once per day at 6:00 AM UTC
    - cron: "0 6 * * *"

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install arcgis requests

      - name: Generate trip report
        env:
          AGOL_USERNAME: ${{ secrets.AGOL_USERNAME }}
          AGOL_PASSWORD: ${{ secrets.AGOL_PASSWORD }}
        run: |
          python scripts/generate_public_land_lovers_trip_report.py \
            --output public/VanLife

      - name: Commit and push if the report changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/VanLife

          if git diff --cached --quiet; then
            echo "No changes to the trip report — nothing to commit."
            exit 0
          fi

          git commit -m "Auto-regenerate VanLife trip report"

          # Make sure main hasn't changed since the workflow started.
          git fetch origin main

          # Replay our generated-report commit on top of the latest main.
          git rebase origin/main

          # Push the updated branch.
          git push origin HEAD:main
