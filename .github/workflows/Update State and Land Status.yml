name: Update State and Land Status

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  update-state-land-status:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install arcgis requests

      - name: Run state and land status update
        env:
          AGOL_USERNAME: ${{ secrets.AGOL_USERNAME }}
          AGOL_PASSWORD: ${{ secrets.AGOL_PASSWORD }}
        run: |
          python scripts/update_point_state_land_status.py
